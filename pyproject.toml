[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "climbsync"
version = "0.1.0"
description = "Synchronize two climbing videos of the same route into one side-by-side comparison."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Try-to-Climb" }]
dependencies = [
    "numpy>=1.26",
    "opencv-python>=4.9",
    "ultralytics>=8.2",
    "imageio-ffmpeg>=0.5",
    "jinja2>=3.1",
    "matplotlib>=3.8",
    "pillow>=10.0",
    "tqdm>=4.66",
    "typer>=0.12",
    "scipy>=1.11",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
]

[project.urls]
Homepage = "https://github.com/Try-to-Climb/climbsync"

[project.scripts]
climbsync = "climbsync.cli:app"

[tool.setuptools.packages.find]
where = ["src"]
include = ["climbsync*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008", "E501", "B905"]
